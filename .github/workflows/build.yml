name: build

# Builds on ordinary Linux runners. The images contain FreeBSD binaries, but
# nothing FreeBSD ever executes during the build — see the Containerfile.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # FreeBSD rebuilds every Go port when the toolchain moves, roughly
  # fortnightly, without the application version changing. A weekly build picks
  # those up; without it the images would sit on a stale Go runtime.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oauth2-proxy-freebsd
  # Which base the unsuffixed tags (:latest, :<version>) point at.
  DEFAULT_SLUG: freebsd15.1
  # Not a performance knob. With the overlay driver, buildah leaves overlayfs
  # bookkeeping attributes (user.overlay.impure, user.overlay.origin) on any
  # directory the COPY merges into. user.overlay.origin has an EMPTY value, and
  # podman on FreeBSD indexes value[0] when applying it, so the pull panics:
  #   ExtattrSetLink ... index out of range [0] with length 0
  # vfs produces no such attributes. Verified against podman 5.8.4 on FreeBSD 15.1.
  STORAGE_DRIVER: vfs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # One entry per (base release, architecture). The package ABI tracks the
      # base's major version — a 14.x image must take its package from the
      # FreeBSD:14 repo, not FreeBSD:15 — so abi is spelled out rather than
      # derived. Supported releases as of 2026-08-20.
      #
      # CURRENT is deliberately absent. Its base image and packages both move on
      # their own, so a weekly job would keep republishing a tag nobody watches,
      # against a branch carrying no support commitment. Add an entry here if you
      # ever want to test against it.
      matrix:
        include:
          - { slug: freebsd15.1,      base: '15.1',    arch: amd64, abi: 'FreeBSD:15:amd64'   }
          - { slug: freebsd15.1,      base: '15.1',    arch: arm64, abi: 'FreeBSD:15:aarch64' }
          - { slug: freebsd15.0,      base: '15.0',    arch: amd64, abi: 'FreeBSD:15:amd64'   }
          - { slug: freebsd15.0,      base: '15.0',    arch: arm64, abi: 'FreeBSD:15:aarch64' }
          - { slug: freebsd14.4,      base: '14.4',    arch: amd64, abi: 'FreeBSD:14:amd64'   }
          - { slug: freebsd14.4,      base: '14.4',    arch: arm64, abi: 'FreeBSD:14:aarch64' }
    steps:
      - uses: actions/checkout@v5

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Stage the FreeBSD package
        id: stage
        run: |
          ./fetch-pkg.sh "${{ matrix.abi }}" oauth2-proxy rootfs
          echo "version=$(cat rootfs.version)" >> "$GITHUB_OUTPUT"

      # Cheap proof that the staged tree is the architecture we asked for. A
      # silent mismatch would produce an image that only fails at run time, on
      # somebody else's machine.
      - name: Check the binary's architecture
        run: |
          file rootfs/usr/local/bin/oauth2-proxy
          case "${{ matrix.arch }}" in
            amd64) file rootfs/usr/local/bin/oauth2-proxy | grep -q 'x86-64' ;;
            arm64) file rootfs/usr/local/bin/oauth2-proxy | grep -q 'aarch64' ;;
          esac
          file rootfs/usr/local/bin/oauth2-proxy | grep -q 'FreeBSD'

      - name: Build
        run: |
          buildah bud \
            --platform "freebsd/${{ matrix.arch }}" \
            --build-arg "FREEBSD_VERSION=${{ matrix.base }}" \
            --build-arg ROOTFS=rootfs \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${{ steps.stage.outputs.version }}" \
            --annotation "org.opencontainers.image.base.name=docker.io/freebsd/freebsd-runtime:${{ matrix.base }}" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            -t "localhost/build:${{ matrix.slug }}-${{ matrix.arch }}" \
            -f Containerfile .

      # The architecture check above proves the binary is right. This proves the
      # layer is applyable on the target OS, which is a different failure: the
      # first published image passed every other check and still panicked podman
      # on FreeBSD the moment it was pulled.
      - name: Check the layer carries no FreeBSD-hostile xattrs
        run: |
          rm -rf /tmp/imgdir
          buildah push "localhost/build:${{ matrix.slug }}-${{ matrix.arch }}" "dir:/tmp/imgdir"
          python3 - <<'PY'
          import glob, tarfile, sys
          bad = []
          for path in glob.glob('/tmp/imgdir/*'):
              try:
                  tf = tarfile.open(path)
              except Exception:
                  continue          # config/manifest json, not a layer
              for member in tf.getmembers():
                  for key, value in member.pax_headers.items():
                      if 'xattr' not in key.lower():
                          continue
                      if len(value) == 0 or '.overlay.' in key:
                          bad.append(f'{member.name}: {key}={value!r}')
          if bad:
              print('Layer carries xattrs that break podman on FreeBSD:')
              for b in bad[:20]:
                  print('  ', b)
              sys.exit(1)
          print('layer xattrs: clean')
          PY

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      # Per-architecture tags carry the version actually resolved for THIS
      # (base, arch). They genuinely differ: at the time of writing, aarch64 sat
      # at 7.15.3_1 on FreeBSD:14 and FreeBSD:16 while amd64 was on 7.15.3_2.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          dest="${REGISTRY}/${IMAGE_NAME}"
          buildah push "localhost/build:${{ matrix.slug }}-${{ matrix.arch }}" \
            "docker://${dest}:${{ steps.stage.outputs.version }}-${{ matrix.slug }}-${{ matrix.arch }}"

      # The manifest job discovers what to assemble from these, so the matrix
      # above is the only place the target list is written down.
      - name: Record what this job produced
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p out
          echo "${{ steps.stage.outputs.version }}" > "out/${{ matrix.slug }}__${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: built-${{ matrix.slug }}-${{ matrix.arch }}
          path: out/

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Log in to the registry
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      - name: Assemble the multi-architecture tags
        run: |
          set -eu
          dest="${REGISTRY}/${IMAGE_NAME}"
          slugs=$(ls built | sed 's/__.*//' | sort -u)
          echo "bases built: $slugs"

          for slug in $slugs; do
            m="manifest-${slug}"
            buildah manifest create "$m"
            same=yes; first=""
            for arch in amd64 arm64; do
              f="built/${slug}__${arch}"
              if [ ! -f "$f" ]; then
                echo "NOTE: ${slug} has no ${arch} build; its manifest will not include ${arch}"
                same=no
                continue
              fi
              v=$(cat "$f")
              buildah manifest add "$m" "docker://${dest}:${v}-${slug}-${arch}"
              [ -z "$first" ] && first="$v" || { [ "$v" = "$first" ] || same=no; }
            done

            # Moving tag, always published: :freebsd15.1, :freebsd14.4, ...
            buildah manifest push --all "$m" "docker://${dest}:${slug}"

            # Version-stamped multi-arch tag only when every architecture really
            # is that version. Otherwise the tag would name a version that one
            # of its own members is not, so it is skipped and said out loud.
            if [ "$same" = yes ]; then
              buildah manifest push --all "$m" "docker://${dest}:${first}-${slug}"
            else
              echo "SKIP :<version>-${slug} — architectures differ in package version"
              for arch in amd64 arm64; do
                [ -f "built/${slug}__${arch}" ] && echo "    ${arch}=$(cat "built/${slug}__${arch}")"
              done
            fi

            if [ "$slug" = "${DEFAULT_SLUG}" ]; then
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                buildah manifest push --all "$m" "docker://${dest}:latest"
              fi
              [ "$same" = yes ] && buildah manifest push --all "$m" "docker://${dest}:${first}"
              case "$GITHUB_REF" in
                refs/tags/*) buildah manifest push --all "$m" "docker://${dest}:${GITHUB_REF#refs/tags/}" ;;
              esac
            fi
          done
