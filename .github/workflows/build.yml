name: build

# Builds on ordinary Linux runners. The image contains FreeBSD binaries, but
# nothing FreeBSD ever executes during the build — see the Containerfile.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # FreeBSD rebuilds every Go port when the toolchain moves, roughly
  # fortnightly, without the application version changing. A weekly build picks
  # those up; without it the image would sit on a stale Go runtime.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oauth2-proxy-freebsd
  # The base release the default tags are built from. A second variant is built
  # from 15.0 as well — see the matrix. FreeBSD supports older userland on a
  # newer kernel, never the reverse, so a 15.1-based image is not guaranteed to
  # run on a 15.0 kernel: 15.1 added four syscalls (kexec_load, pdrfork, pdwait,
  # renameat2) that a 15.0 kernel does not have. Nothing here is likely to call
  # them, but "unlikely" is not a property you want in an auth proxy.
  DEFAULT_BASE: '15.1'
  # Not a performance knob. With the overlay driver, buildah leaves overlayfs
  # bookkeeping attributes (user.overlay.impure, user.overlay.origin) on any
  # directory the COPY merges into. user.overlay.origin has an EMPTY value, and
  # podman on FreeBSD indexes value[0] when applying it, so the pull panics:
  #   ExtattrSetLink ... index out of range [0] with length 0
  # vfs produces no such attributes. Verified against podman 5.8.4 on FreeBSD 15.1.
  STORAGE_DRIVER: vfs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        base: ['15.1', '15.0']
        include:
          - arch: amd64
            abi: FreeBSD:15:amd64
          - arch: arm64
            abi: FreeBSD:15:aarch64
    outputs:
      # Both architectures resolve the same package version, so whichever
      # matrix job reports last is fine. If they ever disagreed — a repository
      # mid-sync — the manifest job's `add` would not find the other tag and
      # the build would fail rather than publish a mismatched pair.
      version: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Stage the FreeBSD package
        id: stage
        run: |
          ./fetch-pkg.sh "${{ matrix.abi }}" oauth2-proxy rootfs
          echo "version=$(cat rootfs.version)" >> "$GITHUB_OUTPUT"

      # Cheap proof that the staged tree is the architecture we asked for. A
      # silent mismatch would produce an image that only fails at run time, on
      # somebody else's machine.
      - name: Check the binary's architecture
        run: |
          file rootfs/usr/local/bin/oauth2-proxy
          case "${{ matrix.arch }}" in
            amd64) file rootfs/usr/local/bin/oauth2-proxy | grep -q 'x86-64' ;;
            arm64) file rootfs/usr/local/bin/oauth2-proxy | grep -q 'aarch64' ;;
          esac
          file rootfs/usr/local/bin/oauth2-proxy | grep -q 'FreeBSD'

      - name: Build
        run: |
          buildah bud \
            --platform "freebsd/${{ matrix.arch }}" \
            --build-arg "FREEBSD_VERSION=${{ matrix.base }}" \
            --build-arg ROOTFS=rootfs \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${{ steps.stage.outputs.version }}" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            -t "localhost/build:${{ matrix.base }}-${{ matrix.arch }}" \
            -f Containerfile .

      # The architecture check above proves the binary is right. This proves the
      # layer is applyable on the target OS, which is a different failure: the
      # first published image passed every other check and still panicked podman
      # on FreeBSD the moment it was pulled.
      - name: Check the layer carries no FreeBSD-hostile xattrs
        run: |
          rm -rf /tmp/imgdir
          buildah push "localhost/build:${{ matrix.base }}-${{ matrix.arch }}" "dir:/tmp/imgdir"
          python3 - <<'PY'
          import glob, tarfile, sys
          bad = []
          for path in glob.glob('/tmp/imgdir/*'):
              try:
                  tf = tarfile.open(path)
              except Exception:
                  continue          # config/manifest json, not a layer
              for member in tf.getmembers():
                  for key, value in member.pax_headers.items():
                      if 'xattr' not in key.lower():
                          continue
                      if len(value) == 0 or '.overlay.' in key:
                          bad.append(f'{member.name}: {key}={value!r}')
          if bad:
              print('Layer carries xattrs that break podman on FreeBSD:')
              for b in bad[:20]:
                  print('  ', b)
              sys.exit(1)
          print('layer xattrs: clean')
          PY

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: |
          buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      # Per-architecture tags. The multi-arch tag is assembled in the next job,
      # because a manifest list can only be built once both exist.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          dest="${REGISTRY}/${IMAGE_NAME}"
          buildah push "localhost/build:${{ matrix.base }}-${{ matrix.arch }}" \
            "docker://${dest}:${{ steps.stage.outputs.version }}-freebsd${{ matrix.base }}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Log in to the registry
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      - name: Assemble the multi-architecture tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          dest="${REGISTRY}/${IMAGE_NAME}"

          # One multi-arch tag per base release: :<pkgver>-freebsd15.1 and
          # :<pkgver>-freebsd15.0. Pick the one matching your host's kernel.
          for base in 15.1 15.0; do
            m="${VERSION}-freebsd${base}"
            buildah manifest create "$m"
            for arch in amd64 arm64; do
              buildah manifest add "$m" "docker://${dest}:${m}-${arch}"
            done
            buildah manifest push --all "$m" "docker://${dest}:${m}"
          done

          # The unsuffixed tags track DEFAULT_BASE, so existing references keep
          # meaning what they meant.
          d="${VERSION}-freebsd${DEFAULT_BASE}"
          buildah manifest push --all "$d" "docker://${dest}:${VERSION}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            buildah manifest push --all "$d" "docker://${dest}:latest"
          fi
          case "${GITHUB_REF}" in
            refs/tags/*)
              buildah manifest push --all "$d" "docker://${dest}:${GITHUB_REF#refs/tags/}" ;;
          esac
