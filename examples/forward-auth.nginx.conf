# Forward-auth against a shared oauth2-proxy gateway.
#
# Drop this into the server block of any application you want gated. The
# application keeps serving itself; nginx asks the gateway, per request, who the
# visitor is. Nothing in the application needs to know about OAuth.
#
# Replace https://blueteam.example.com with your gateway, and make sure this
# host falls inside the gateway's --whitelist-domain and shares its
# --cookie-domain parent.

# Behind a TLS-terminating proxy the request arrives over plain http, so trust
# X-Forwarded-* when present in order to build a redirect the browser can follow.
map $http_x_forwarded_proto $fwd_scheme {
    default     $scheme;
    "~^https?$" $http_x_forwarded_proto;
}
map $http_x_forwarded_host $fwd_host {
    default $http_host;
    "~."    $http_x_forwarded_host;
}

server {
    listen 80;
    server_name app.example.com;
    root /usr/local/www/app;

    # Declared at server level so every location inherits it: nothing is served
    # until the gateway says who the visitor is.
    set $target_url $fwd_scheme://$fwd_host$request_uri;
    auth_request /internal/authz;

    # The identity, lifted from the gateway's response. Use the email: with an
    # OIDC provider x_auth_request_user carries the provider's opaque subject,
    # which is not an identity anyone will recognise in a log.
    auth_request_set $auth_user  $upstream_http_x_auth_request_email;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;

    # 401 = nobody is signed in, so bounce to the gateway and come back after.
    # 403 = signed in but not permitted, so say so rather than looping.
    error_page 401 = @auth_signin;
    error_page 403 = @auth_denied;

    location = /internal/authz {
        internal;
        auth_request off;                 # never gate the gatekeeper

        # Via a variable deliberately: a literal upstream is resolved once at
        # start-up, so nginx would refuse to boot whenever the gateway is down,
        # and would keep using a stale address after it moved.
        set $authz https://blueteam.example.com/oauth2/auth;
        proxy_pass $authz;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL    $target_url;
        proxy_set_header X-Forwarded-Proto $fwd_scheme;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location @auth_signin {
        auth_request off;
        # An ABSOLUTE rd=, which is why this host must be inside the gateway's
        # --whitelist-domain. Otherwise the gateway drops it as an open redirect
        # and the visitor lands on the gateway instead of coming back here.
        return 302 https://blueteam.example.com/oauth2/start?rd=$target_url;
    }

    location @auth_denied {
        auth_request off;
        default_type text/plain;
        return 403 "403 - your account is not allowed to use this application.\n";
    }

    # Ungated: a health check that needed authentication would be useless.
    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Hand the identity to the application however it expects it.
        proxy_set_header X-Forwarded-User  $auth_user;
        proxy_set_header X-Forwarded-Email $auth_email;
        proxy_pass http://127.0.0.1:8080;
    }
}

# The gateway requires --set-xauthrequest for any of this to work: without it
# the /oauth2/auth response carries no X-Auth-Request-* headers and every
# auth_request_set above resolves to an empty string. The request is still
# gated — but the application learns nothing about who is calling it.
